name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run Tests
        run: npx nx run-many --target test --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.workflow }}-${{ github.run_id }}
          path: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
