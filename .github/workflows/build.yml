name: Build
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npx nx build taiga-lumbermill

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
