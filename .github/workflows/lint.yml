name: Lint
on: [pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npm run typecheck

  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npm run cspell -- --no-progress

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npm run prettier -- --check

  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npm run stylelint

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - uses: taiga-family/ci/actions/setup/node@9a6df142c71fc7ea736e993d344b0e99338370cf # v2.25.0
      - run: npm run lint

  result:
    needs: [prettier, eslint, stylelint, cspell, typecheck]
    runs-on: ubuntu-latest
    name: Lint result
    steps:
      - run: echo "Success"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
