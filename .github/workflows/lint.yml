name: Lint
on: [pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - run: npm run typecheck

  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - run: npm run cspell -- --no-progress

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - run: npm run prettier -- --check

  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - run: npm run stylelint

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: taiga-family/ci/actions/setup/variables@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - uses: taiga-family/ci/actions/setup/node@30acd5f9c51f51e47ceb0662ff16199c3628e1bf # v1.126.0
      - run: npm run lint

  result:
    needs: [prettier, eslint, stylelint, cspell, typecheck]
    runs-on: ubuntu-latest
    name: Lint result
    steps:
      - run: echo "Success"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
