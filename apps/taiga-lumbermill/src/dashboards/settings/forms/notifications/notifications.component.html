<div tuiHeader="h5">
    <h2 tuiTitle>
        Notifications
        <div tuiSubtitle>You can specify notification level per group or per project.</div>
    </h2>
</div>

<form
    tuiForm="m"
    tuiTextfieldSize="m"
    [formGroup]="form"
    (ngSubmit)="submit()"
>
    <label tuiLabel>
        <tui-textfield
            tuiChevron
            [content]="valueContent"
            [tuiTextfieldCleaner]="false"
        >
            <label tuiLabel>Global notification level</label>

            <input
                formControlName="level"
                tuiSelect
            />
            <tui-data-list-wrapper
                *tuiDropdown
                [itemContent]="itemContent"
                [items]="items"
            />

            <ng-template
                #itemContent
                let-item
            >
                <span tuiCell="m">
                    <span
                        appearance="primary-grayscale"
                        size="l"
                        [tuiAvatar]="item.icon"
                    ></span>
                    <span tuiTitle>
                        {{ item.title }}
                        <span tuiSubtitle>{{ item.description }}</span>
                    </span>
                </span>
            </ng-template>
            <ng-template
                #valueContent
                let-item
            >
                <span>{{ item.title }}</span>
            </ng-template>
        </tui-textfield>
        By default, all projects and groups use the global notifications setting.
    </label>

    <div tuiHeader="h6">
        <h3
            tuiTitle
            class="links"
        >
            Email notifications
        </h3>
    </div>

    <label tuiBlock="m">
        <span tuiTitle>
            Marketing emails
            <span tuiSubtitle>Receive emails about new products, features, and more.</span>
        </span>
        <input
            formControlName="marketing"
            tuiCheckbox
            type="checkbox"
        />
    </label>
    <label tuiBlock="m">
        <span tuiTitle>
            Social emails
            <span tuiSubtitle>Receive emails for friend requests, follows, and more.</span>
        </span>
        <input
            formControlName="social"
            tuiCheckbox
            type="checkbox"
        />
    </label>
    <label tuiBlock="m">
        <span tuiTitle>
            Security emails
            <span tuiSubtitle>Receive emails about your account activity and security.</span>
        </span>
        <input
            formControlName="security"
            tuiCheckbox
            type="checkbox"
        />
    </label>

    <button
        appearance="primary-grayscale"
        size="m"
        tuiButton
        type="submit"
        class="submit-button"
    >
        Update notifications
    </button>
</form>
