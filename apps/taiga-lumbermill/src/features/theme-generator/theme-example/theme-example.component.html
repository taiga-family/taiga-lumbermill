<div
    appearance="outline-grayscale"
    tuiCardLarge="normal"
    class="example-block"
>
    <div tuiHeader="h3">
        <h3 tuiTitle>
            Title example
            <div tuiSubtitle>Subtitle example</div>
        </h3>
    </div>
    <tui-textfield>
        <label tuiLabel>Type a sum</label>

        <input
            tuiInputNumber
            [formControl]="exampleControl"
            [prefix]="'USD' | tuiCurrency"
        />
    </tui-textfield>
    <div class="row">
        <div class="col">
            <div
                appearance="floating"
                tuiCardLarge
            >
                <header tuiHeader>
                    <h1 tuiTitle>
                        Title
                        <span tuiSubtitle>Subtitle</span>
                    </h1>
                </header>

                @for (_ of '-'.repeat(3); track $index) {
                    <button
                        tuiCell="l"
                        tuiDropdownAlign="end"
                        tuiDropdownAuto
                        type="button"
                        [tuiDropdown]="dropdown"
                        [tuiDropdownSided]="true"
                    >
                        <span
                            appearance="primary"
                            size="l"
                            tuiAvatar="@tui.star"
                        ></span>

                        <div tuiTitle>
                            Title
                            <div tuiSubtitle>Description</div>
                        </div>

                        <tui-icon
                            icon="@tui.chevron-right"
                            tuiAppearance="icon"
                        />
                    </button>
                }

                <button
                    tuiLink
                    type="button"
                >
                    Show all
                </button>
            </div>

            <ng-template
                #dropdown
                let-close
            >
                <tui-data-list>
                    <tui-opt-group>
                        @for (item of ['Edit', 'Download', 'Rename', 'Delete']; track item) {
                            <button
                                tuiOption
                                type="button"
                            >
                                {{ item }}
                            </button>
                        }
                    </tui-opt-group>
                    <tui-opt-group>
                        <button
                            tuiOption
                            type="button"
                            (click)="close()"
                        >
                            Nevermind
                        </button>
                    </tui-opt-group>
                </tui-data-list>
            </ng-template>
        </div>
        <div class="col">
            <div
                appearance="floating"
                tuiCardLarge
            >
                <tui-textfield [tuiTextfieldCleaner]="true">
                    <label tuiLabel>Choose a year</label>
                    <input
                        placeholder="Not 2022 please"
                        tuiInputYear
                        [formControl]="exampleYearControl"
                    />

                    <tui-calendar-year *tuiDropdown />
                </tui-textfield>
                <div class="list">
                    @for (badge of badges; track $index) {
                        <span
                            tuiBadge
                            [appearance]="badge"
                        >
                            {{ badge | titlecase }}
                        </span>
                    }
                </div>
                <input
                    size="m"
                    tuiCheckbox
                    type="checkbox"
                    [ngModel]="true"
                />
                <input
                    size="m"
                    tuiSwitch
                    type="checkbox"
                    [disabled]="true"
                    [ngModel]="true"
                />
            </div>
        </div>
    </div>
    <div class="list">
        @for (button of buttons; track $index) {
            <button
                tuiButton
                type="button"
                [appearance]="button"
            >
                {{ button | titlecase }}
            </button>
        }
    </div>
</div>
